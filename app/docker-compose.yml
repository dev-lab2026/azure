services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: clarity-app:latest
    container_name: clarity-app
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 3000

      DATABASE_URL: "postgresql://clarity_admin:clarity_change_me@postgres:5432/clarity_pm_enterprise"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: clarity_pm_enterprise
      POSTGRES_USER: clarity_admin
      POSTGRES_PASSWORD: clarity_change_me
      POSTGRES_SSL: disable
      APP_URL: "http://localhost"
      CLARITY_SECRET_FILE: /data/clarity.secret

    ports:
      - "80:3000"

    volumes:
      - clarity_runtime:/data

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - clarity_network

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: clarity-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: clarity_pm_enterprise
      POSTGRES_USER: clarity_admin
      POSTGRES_PASSWORD: clarity_change_me

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01_init_schema.sql:ro

    networks:
      - clarity_network

    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: clarity-postgres-data
  clarity_runtime:
    name: clarity-runtime

networks:
  clarity_network:
    driver: bridge
