---
- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Checkout application repository
  ansible.builtin.git:
    repo: "{{ repo_url }}"
    dest: "{{ app_dir }}"
    version: "{{ repo_branch }}"
    force: true
    update: true

- name: Show Git remote
  ansible.builtin.command:
    cmd: git remote -v
    chdir: "{{ app_dir }}"
  register: git_remote
  changed_when: false

- name: Display Git remote
  ansible.builtin.debug:
    var: git_remote.stdout_lines

- name: Show Git commit
  ansible.builtin.command:
    cmd: git rev-parse HEAD
    chdir: "{{ app_dir }}"
  register: git_commit
  changed_when: false

- name: Display Git commit
  ansible.builtin.debug:
    msg: "Application repository commit: {{ git_commit.stdout }}"

- name: Verify application directory
  ansible.builtin.stat:
    path: "{{ app_dir }}/app/docker-compose.yml"
  register: compose_file

- name: Display Compose path
  ansible.builtin.debug:
    msg: "Docker Compose: {{ app_dir }}/app/docker-compose.yml"

- name: Validate Docker Compose syntax
  ansible.builtin.command:
    cmd: docker compose -f docker-compose.yml config
    chdir: "{{ app_dir }}/app"
  register: compose_config
  changed_when: false

- name: Show Docker Compose validation
  ansible.builtin.debug:
    var: compose_config.stdout_lines

- name: Build and start application
  ansible.builtin.command:
    cmd: docker compose -f docker-compose.yml up -d --build
    chdir: "{{ app_dir }}/app"
  register: compose_up

- name: Show Docker Compose output
  ansible.builtin.debug:
    var: compose_up.stdout_lines
