---
- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Checkout application repository
  ansible.builtin.git:
    repo: "{{ repo_url }}"
    dest: "{{ app_dir }}"
    version: "{{ repo_branch }}"
    force: true
    update: true

- name: Show Git remote
  ansible.builtin.command:
    cmd: git remote -v
    chdir: "{{ app_dir }}"
  register: git_remote
  changed_when: false

- name: Display Git remote
  ansible.builtin.debug:
    var: git_remote.stdout_lines

- name: Show Git commit
  ansible.builtin.command:
    cmd: git rev-parse HEAD
    chdir: "{{ app_dir }}"
  register: git_commit
  changed_when: false

- name: Display Git commit
  ansible.builtin.debug:
    msg: "Application repository commit: {{ git_commit.stdout }}"

- name: Verify application directory
  ansible.builtin.stat:
    path: "{{ compose_dir }}"
  register: application_directory

- name: Fail if application directory does not exist
  ansible.builtin.assert:
    that:
      - application_directory.stat.exists
      - application_directory.stat.isdir
    fail_msg: "Application directory not found: {{ compose_dir }}"

- name: Verify Docker Compose file
  ansible.builtin.stat:
    path: "{{ compose_dir }}/{{ compose_file }}"
  register: compose_file_stat

- name: Fail if Docker Compose file does not exist
  ansible.builtin.assert:
    that:
      - compose_file_stat.stat.exists
      - compose_file_stat.stat.isreg
    fail_msg: "Docker Compose file not found: {{ compose_dir }}/{{ compose_file }}"

- name: Verify environment file
  ansible.builtin.stat:
    path: "{{ compose_dir }}/.env"
  register: env_file_stat

- name: Fail if environment file does not exist
  ansible.builtin.assert:
    that:
      - env_file_stat.stat.exists
      - env_file_stat.stat.isreg
    fail_msg: "Environment file not found: {{ compose_dir }}/.env"

- name: Display Compose path
  ansible.builtin.debug:
    msg: "Docker Compose: {{ compose_dir }}/{{ compose_file }}"

- name: Validate Docker Compose syntax
  ansible.builtin.command:
    cmd: docker compose --env-file .env -f "{{ compose_file }}" config
    chdir: "{{ compose_dir }}"
  register: compose_config
  changed_when: false

- name: Show Docker Compose validation
  ansible.builtin.debug:
    msg: "Docker Compose configuration is valid."

- name: Stop existing application
  ansible.builtin.command:
    cmd: docker compose --env-file .env -f "{{ compose_file }}" down --remove-orphans
    chdir: "{{ compose_dir }}"
  register: compose_down
  changed_when: false
  failed_when: false

- name: Build and start application
  ansible.builtin.command:
    cmd: docker compose --env-file .env -f "{{ compose_file }}" up -d --build
    chdir: "{{ compose_dir }}"
  register: compose_up

- name: Show Docker Compose output
  ansible.builtin.debug:
    var: compose_up.stdout_lines

- name: Wait for application
  ansible.builtin.uri:
    url: "http://127.0.0.1/api/health"
    method: GET
    status_code: 200
  register: healthcheck
  retries: 12
  delay: 10
  until: healthcheck.status == 200

- name: Display application health
  ansible.builtin.debug:
    msg: "Clarity application is healthy."
