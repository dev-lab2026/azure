---
# Complete host configuration for the React application.

- name: Install base packages
  ansible.builtin.apt:
    name:
      - git
      - nginx
      - curl
      - ca-certificates
      - build-essential
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install NodeSource repository
  ansible.builtin.shell: |
    set -e
    curl -fsSL https://deb.nodesource.com/setup_{{ node_major }}.x | bash -
  args:
    creates: /etc/apt/sources.list.d/nodesource.list

- name: Install Node.js and npm
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true

- name: Verify Node.js
  ansible.builtin.command: node --version
  register: node_version
  changed_when: false

- name: Verify npm
  ansible.builtin.command: npm --version
  register: npm_version
  changed_when: false

- name: Display runtime versions
  ansible.builtin.debug:
    msg:
      - "Node.js: {{ node_version.stdout }}"
      - "npm: {{ npm_version.stdout }}"

- name: Require repository URL
  ansible.builtin.assert:
    that:
      - repo_url | length > 0
    fail_msg: "Set REPO_URL in the environment or pass -e repo_url=<repository URL>."

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_root }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Checkout application source
  ansible.builtin.git:
    repo: "{{ repo_url }}"
    dest: "{{ app_root }}"
    version: "{{ repo_version }}"
    force: true
    update: true
  become_user: "{{ app_user }}"

- name: Install JavaScript dependencies
  ansible.builtin.command:
    cmd: npm install
    chdir: "{{ app_root }}"
  become_user: "{{ app_user }}"
  environment:
    CI: "true"

- name: Build React application
  ansible.builtin.command:
    cmd: npm run build
    chdir: "{{ app_root }}"
  become_user: "{{ app_user }}"
  environment:
    CI: "true"

- name: Create Nginx web root
  ansible.builtin.file:
    path: "{{ nginx_web_root }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"

- name: Deploy React build
  ansible.builtin.command:
    cmd: "rsync -a --delete {{ app_root }}/dist/ {{ nginx_web_root }}/"
  notify: Restart nginx

- name: Install Nginx virtual host
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/react-app.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart nginx

- name: Enable React virtual host
  ansible.builtin.file:
    src: /etc/nginx/sites-available/react-app.conf
    dest: /etc/nginx/sites-enabled/react-app.conf
    state: link
  notify: Restart nginx

- name: Disable default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Restart nginx

- name: Validate Nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Ensure Nginx is enabled and running
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
