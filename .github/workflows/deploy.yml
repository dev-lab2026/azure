name: Deploy InterFlow

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.15.0"
  TF_DIR: "terraform"
  ANSIBLE_DIR: "ansible"
  VM_USER: "azureadmin"

jobs:
  deploy:
    name: Deploy Infrastructure and Application
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # AZURE OIDC
      # ==========================================================

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # ==========================================================
      # AZURE CHECK
      # ==========================================================

      - name: Verify Azure
        run: |
          set -e

          az account show --output table


      # ==========================================================
      # TERRAFORM
      # ==========================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}


      - name: Terraform Version
        run: |
          terraform version


      # ==========================================================
      # TERRAFORM INIT
      # ==========================================================

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -e

          terraform init \
            -input=false


      # ==========================================================
      # TERRAFORM FORMAT
      # ==========================================================

      - name: Terraform Format
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -e

          terraform fmt \
            -check \
            -recursive


      # ==========================================================
      # TERRAFORM VALIDATE
      # ==========================================================

      - name: Terraform Validate
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -e

          terraform validate


      # ==========================================================
      # TERRAFORM PLAN
      # ==========================================================

      - name: Terraform Plan
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          set -e

          terraform plan \
            -input=false \
            -out=tfplan


      # ==========================================================
      # TERRAFORM APPLY
      # ==========================================================

      - name: Terraform Apply
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          set -e

          terraform apply \
            -input=false \
            -auto-approve \
            tfplan


      # ==========================================================
      # GET VM IP
      # ==========================================================

      - name: Get VM Public IP
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -e

          VM_IP="$(terraform output -raw vm_public_ip)"

          if [ -z "$VM_IP" ]; then
            echo "ERROR: VM public IP is empty."
            exit 1
          fi

          echo "VM_PUBLIC_IP=$VM_IP" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "VM PUBLIC IP: $VM_IP"
          echo "=========================================="


      # ==========================================================
      # SSH SETUP
      # ==========================================================

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa

          chmod 600 ~/.ssh/id_rsa

          ssh-keygen \
            -y \
            -f ~/.ssh/id_rsa \
            > /dev/null

          echo "SSH private key is valid."


            # ==========================================================
      # WAIT FOR SSH
      # ==========================================================

      - name: Wait for SSH
        run: |
          set -e

          echo "=========================================="
          echo "Waiting for SSH"
          echo "=========================================="
          echo "VM: $VM_PUBLIC_IP"
          echo "Port: 22"

          for attempt in {1..30}; do

            echo "Attempt $attempt/30..."

            if nc -z -w 5 "$VM_PUBLIC_IP" 22 2>/dev/null; then
              echo "SSH port 22 is available."
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              echo ""
              echo "ERROR: SSH port 22 is unreachable."
              echo ""
              echo "VM_PUBLIC_IP=$VM_PUBLIC_IP"
              echo ""
              echo "Network test:"
              nc -vz -w 5 "$VM_PUBLIC_IP" 22 || true
              exit 1
            fi

            sleep 10

          done


      # ==========================================================
      # KNOWN HOSTS
      # ==========================================================

      - name: Configure known hosts
        run: |
          set -e

          echo "=========================================="
          echo "Configure SSH known_hosts"
          echo "=========================================="

          rm -f ~/.ssh/known_hosts

          ssh-keyscan \
            -4 \
            -T 10 \
            -p 22 \
            "$VM_PUBLIC_IP" \
            > ~/.ssh/known_hosts 2>/tmp/ssh-keyscan-error.log

          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "ERROR: Unable to retrieve SSH host key."
            echo ""
            echo "ssh-keyscan output:"
            cat /tmp/ssh-keyscan-error.log
            exit 1
          fi

          chmod 644 ~/.ssh/known_hosts

          echo "SSH host key successfully added."

      # ==========================================================
      # SSH TEST
      # ==========================================================

      - name: Test SSH
        run: |
          set -e

          ssh \
            -4 \
            -i ~/.ssh/id_rsa \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_PUBLIC_IP" \
            "echo SSH_OK"


      # ==========================================================
      # ANSIBLE
      # ==========================================================

      - name: Install Ansible
        run: |
          set -e

          python3 -m pip install --upgrade pip
          python3 -m pip install ansible

          ansible --version


      # ==========================================================
      # INVENTORY
      # ==========================================================

      - name: Generate Ansible inventory
        run: |
          set -e

          mkdir -p "$ANSIBLE_DIR"

          cat > "$ANSIBLE_DIR/inventory.ini" <<EOF
          [web]
          $VM_PUBLIC_IP

          [all:vars]
          ansible_user=$VM_USER
          ansible_ssh_private_key_file=/home/runner/.ssh/id_rsa
          ansible_python_interpreter=/usr/bin/python3
          ansible_host_key_checking=false
          EOF

          echo "Ansible inventory:"
          cat "$ANSIBLE_DIR/inventory.ini"


      # ==========================================================
      # ANSIBLE PING
      # ==========================================================

      - name: Ansible Ping
        run: |
          set -e

          ansible \
            -i "$ANSIBLE_DIR/inventory.ini" \
            web \
            -m ping


      # ==========================================================
      # DEPLOY APPLICATION
      # ==========================================================

      - name: Deploy InterFlow
        run: |
          set -e

          ansible-playbook \
            -i "$ANSIBLE_DIR/inventory.ini" \
            "$ANSIBLE_DIR/site.yml"


      # ==========================================================
      # VERIFY DOCKER
      # ==========================================================

      - name: Verify Docker
        run: |
          set -e

          ssh \
            -4 \
            -i ~/.ssh/id_rsa \
            "$VM_USER@$VM_PUBLIC_IP" \
            "docker ps"


      # ==========================================================
      # APPLICATION HEALTH
      # ==========================================================

      - name: Health Check
        run: |
          set -e

          echo "Waiting for InterFlow..."

          for attempt in {1..12}; do

            if curl \
              --fail \
              --silent \
              --show-error \
              "http://$VM_PUBLIC_IP/api/health"
            then

              echo ""
              echo "InterFlow is healthy."
              exit 0

            fi

            echo "Application not ready - attempt $attempt/12"

            sleep 10

          done

          echo "ERROR: InterFlow health check failed."
          exit 1


      # ==========================================================
      # SUCCESS
      # ==========================================================

      - name: Deployment Summary
        if: success()
        run: |
          echo ""
          echo "=========================================="
          echo "       DEPLOYMENT SUCCESSFUL"
          echo "=========================================="
          echo ""
          echo "Application:"
          echo "http://$VM_PUBLIC_IP"
          echo ""
          echo "Terraform: OK"
          echo "Azure OIDC: OK"
          echo "SSH: OK"
          echo "Ansible: OK"
          echo "Docker: OK"
          echo "Health Check: OK"
          echo ""
          echo "=========================================="
      - name: DEBUG - Show workflow
        run: |
          echo "WORKFLOW = $GITHUB_WORKFLOW"
          echo "WORKFLOW_REF = $GITHUB_WORKFLOW_REF"
          echo "SHA = $GITHUB_SHA"
          echo "BRANCH = $GITHUB_REF_NAME"

          echo "======================================"
          echo "Searching terraform.tfvars"
          echo "======================================"

          grep -Rni \
            --exclude-dir=.git \
            "terraform.tfvars" \
            .github \
            terraform \
            || true
