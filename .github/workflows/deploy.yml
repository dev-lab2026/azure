name: Deploy React application to Azure VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
  TF_VAR_project_name: "reactcicd"
  TF_VAR_environment: "prod"
  TF_VAR_location: "West Europe"
  REPO_URL: https://github.com/${{ github.repository }}.git

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

      - name: Export VM public IP
        id: terraform-output
        working-directory: terraform
        run: |
          IP="$(terraform output -raw vm_public_ip)"
          echo "vm_public_ip=${IP}" >> "$GITHUB_OUTPUT"
          echo "VM public IP: ${IP}"

      - name: Install Ansible and rsync
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ansible
          sudo apt-get update
          sudo apt-get install -y rsync

      - name: Configure SSH key
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          ssh-keygen -y -f "$HOME/.ssh/id_rsa" > /dev/null

      - name: Generate Ansible inventory
        env:
          VM_PUBLIC_IP: ${{ steps.terraform-output.outputs.vm_public_ip }}
        run: |
          set -euo pipefail
          sed \
            -e "s|\${vm_public_ip}|${VM_PUBLIC_IP}|g" \
            -e "s|\${admin_username}|azureadmin|g" \
            -e "s|\${ssh_key_path}|$HOME/.ssh/id_rsa|g" \
            ansible/inventory.tpl > ansible/inventory.ini
          cat ansible/inventory.ini

      - name: Wait for SSH
        env:
          VM_PUBLIC_IP: ${{ steps.terraform-output.outputs.vm_public_ip }}
        run: |
          for i in {1..30}; do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 -i "$HOME/.ssh/id_rsa" azureadmin@"$VM_PUBLIC_IP" "echo ssh-ready" 2>/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "SSH did not become available in time."
          exit 1

      - name: Run Ansible
        env:
          REPO_URL: ${{ env.REPO_URL }}
        run: |
          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/playbook.yml \
            -e "repo_url=${REPO_URL}" \
            -e "repo_version=${GITHUB_SHA}"

      - name: Verify HTTP deployment
        env:
          VM_PUBLIC_IP: ${{ steps.terraform-output.outputs.vm_public_ip }}
        run: |
          set -e
          for i in {1..12}; do
            if curl --fail --silent --show-error --max-time 10 "http://${VM_PUBLIC_IP}/health"; then
              echo
              echo "Deployment successful: http://${VM_PUBLIC_IP}"
              exit 0
            fi
            sleep 5
          done
          echo "Application health check failed."
          exit 1
