name: Deploy to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permissions nécessaires pour GitHub OIDC
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Azure Login - OIDC
      # --------------------------------------------------
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # --------------------------------------------------
      # 3. Vérification Azure
      # --------------------------------------------------
      - name: Verify Azure connection
        run: |
          az account show
          az account list --output table

      # --------------------------------------------------
      # 4. Installation Terraform
      # --------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      # --------------------------------------------------
      # 5. Terraform Init
      # --------------------------------------------------
      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init

      # --------------------------------------------------
      # 6. Terraform Validate
      # --------------------------------------------------
      - name: Terraform Validate
        working-directory: terraform
        run: |
          terraform validate

      # --------------------------------------------------
      # 7. Terraform Plan
      # --------------------------------------------------
      - name: Terraform Plan
        working-directory: terraform
        env:
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          terraform plan \
            -var="ssh_public_key=${TF_VAR_ssh_public_key}"

      # --------------------------------------------------
      # 8. Terraform Apply
      # --------------------------------------------------
      - name: Terraform Apply
        working-directory: terraform
        env:
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          terraform apply \
            -auto-approve \
            -var="ssh_public_key=${TF_VAR_ssh_public_key}"

      # --------------------------------------------------
      # 9. Récupération IP publique
      # --------------------------------------------------
      - name: Get VM Public IP
        working-directory: terraform
        run: |
          VM_IP=$(terraform output -raw vm_public_ip)

          echo "VM_PUBLIC_IP=$VM_IP" >> "$GITHUB_ENV"

          echo "======================================"
          echo "VM Public IP: $VM_IP"
          echo "======================================"

      # --------------------------------------------------
      # 10. Test SSH
      # --------------------------------------------------
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa

          chmod 600 ~/.ssh/id_rsa

          ssh-keygen -y -f ~/.ssh/id_rsa > /dev/null

          ssh-keyscan -H "$VM_PUBLIC_IP" >> ~/.ssh/known_hosts

      # --------------------------------------------------
      # 11. Vérification SSH
      # --------------------------------------------------
      - name: Test SSH connection
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=yes \
            azureuser@"$VM_PUBLIC_IP" \
            "echo 'SSH connection OK'"

      # --------------------------------------------------
      # 12. Installation Ansible
      # --------------------------------------------------
      - name: Install Ansible
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ansible

      # --------------------------------------------------
      # 13. Génération inventory Ansible
      # --------------------------------------------------
      - name: Generate Ansible inventory
        run: |
          mkdir -p ansible

          cat > ansible/inventory.ini <<EOF
          [web]
          ${VM_PUBLIC_IP}

          [all:vars]
          ansible_user=azureuser
          ansible_ssh_private_key_file=/home/runner/.ssh/id_rsa
          ansible_host_key_checking=false
          EOF

          cat ansible/inventory.ini

      # --------------------------------------------------
      # 14. Ansible Deploy
      # --------------------------------------------------
      - name: Deploy application with Ansible
        run: |
          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/site.yml \
            --private-key ~/.ssh/id_rsa
