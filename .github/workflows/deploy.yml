name: Deploy InterFlow

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.15.0"
  TF_DIR: terraform
  ANSIBLE_DIR: ansible
  VM_USER: azureadmin

jobs:
  deploy:
    name: Deploy Infrastructure and Application
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # AZURE LOGIN
      # ==========================================================

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # ==========================================================
      # TERRAFORM
      # ==========================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Terraform Format
        run: terraform -chdir=${{ env.TF_DIR }} fmt -check -recursive

      - name: Terraform Validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          terraform plan \
            -input=false \
            -out=tfplan

      - name: Terraform Apply
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            tfplan


      # ==========================================================
      # GET VM IP
      # ==========================================================

      - name: Get VM Public IP
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -e

          VM_IP="$(terraform output -raw vm_public_ip)"

          test -n "$VM_IP"

          echo "VM_PUBLIC_IP=$VM_IP" >> "$GITHUB_ENV"

          echo "VM IP: $VM_IP"


      # ==========================================================
      # SSH
      # ==========================================================

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa

          chmod 600 ~/.ssh/id_rsa

          ssh-keygen -y -f ~/.ssh/id_rsa > /tmp/ssh_public_key

          echo "SSH key validated."


      # ==========================================================
      # WAIT SSH
      # ==========================================================

      - name: Wait for SSH
        run: |
          set -e

          for i in {1..30}; do
            if nc -z -w 5 "$VM_PUBLIC_IP" 22; then
              echo "SSH available."
              exit 0
            fi

            echo "Waiting for SSH... $i/30"
            sleep 10
          done

          echo "SSH unavailable."
          exit 1


      # ==========================================================
      # KNOWN HOST
      # ==========================================================

      - name: Configure known hosts
        run: |
          set -e

          ssh-keyscan \
            -4 \
            -T 10 \
            "$VM_PUBLIC_IP" \
            >> ~/.ssh/known_hosts

          chmod 644 ~/.ssh/known_hosts


      # ==========================================================
      # SSH TEST
      # ==========================================================

      - name: Test SSH
        run: |
          set -e

          ssh \
            -4 \
            -i ~/.ssh/id_rsa \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$VM_USER@$VM_PUBLIC_IP" \
            "echo SSH_OK"


      # ==========================================================
      # INSTALL ANSIBLE
      # ==========================================================

      - name: Install Ansible
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ansible

          ansible --version


      # ==========================================================
      # INVENTORY
      # ==========================================================

      - name: Generate Ansible inventory
        run: |
          cat > "$ANSIBLE_DIR/inventory.ini" <<EOF
          [web]
          $VM_PUBLIC_IP

          [all:vars]
          ansible_user=$VM_USER
          ansible_ssh_private_key_file=/home/runner/.ssh/id_rsa
          ansible_python_interpreter=/usr/bin/python3
          ansible_host_key_checking=false
          EOF

          cat "$ANSIBLE_DIR/inventory.ini"


      # ==========================================================
      # ANSIBLE PING
      # ==========================================================

      - name: Ansible Ping
        run: |
          ansible \
            -i "$ANSIBLE_DIR/inventory.ini" \
            web \
            -m ping


      # ==========================================================
      # DEPLOY APPLICATION
      # ==========================================================

      - name: Deploy APPLICATION
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          MICROSOFT_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID }}
          MICROSOFT_REDIRECT_URI: ${{ secrets.MICROSOFT_REDIRECT_URI }}
        run: |
          set -e

          ansible-playbook \
            -i "$ANSIBLE_DIR/inventory.ini" \
            "$ANSIBLE_DIR/site.yml" \
            -e "postgres_db=$POSTGRES_DB" \
            -e "postgres_user=$POSTGRES_USER" \
            -e "postgres_password=$POSTGRES_PASSWORD" \
            -e "session_secret=$SESSION_SECRET" \
            -e "microsoft_client_id=$MICROSOFT_CLIENT_ID" \
            -e "microsoft_client_secret=$MICROSOFT_CLIENT_SECRET" \
            -e "microsoft_tenant_id=$MICROSOFT_TENANT_ID" \
            -e "microsoft_redirect_uri=$MICROSOFT_REDIRECT_URI" \
            -e "app_url=http://$VM_PUBLIC_IP"


      # ==========================================================
      # VERIFY DOCKER
      # ==========================================================

      - name: Verify Docker
        run: |
          set -e

          ssh \
            -4 \
            -i ~/.ssh/id_rsa \
            "$VM_USER@$VM_PUBLIC_IP" \
            "docker ps"


      # ==========================================================
      # APPLICATION HEALTH
      # ==========================================================

      - name: Health Check
        run: |
          set -e

          for attempt in {1..18}; do

            if curl \
              --fail \
              --silent \
              --show-error \
              "http://$VM_PUBLIC_IP/api/health"; then

              echo ""
              echo "InterFlow is healthy."
              exit 0
            fi

            echo "Application not ready - $attempt/18"

            sleep 10
          done

          echo "Health check failed."

          ssh \
            -4 \
            -i ~/.ssh/id_rsa \
            "$VM_USER@$VM_PUBLIC_IP" \
            "cd /opt/clarity/app && docker compose --env-file .env ps && docker compose --env-file .env logs --tail=100"

          exit 1


      # ==========================================================
      # SUCCESS
      # ==========================================================

      - name: Deployment Summary
        if: success()
        run: |
          echo ""
          echo "=========================================="
          echo "       DEPLOYMENT SUCCESSFUL"
          echo "=========================================="
          echo ""
          echo "Application:"
          echo "http://$VM_PUBLIC_IP"
          echo ""
          echo "Terraform: OK"
          echo "Azure: OK"
          echo "SSH: OK"
          echo "Ansible: OK"
          echo "Docker: OK"
          echo "Health Check: OK"
          echo ""
